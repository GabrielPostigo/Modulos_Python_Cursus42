[tool.poetry]
name = "loading"
version = "1.0.0"
description = "Matrix data simulation"
authors = ["gapostig"]
readme = "README.md"
python = "^3.10"

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=2.1.0"
numpy = ">=1.25.0"
requests = ">=2.31.0"
matplotlib = ">=3.7.2"

[tool.poetry.group.dev.dependencies]
flake8 = ">=6.0.0"
mypy = ">=1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"
strict = true